<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTOSCAN — Gifting Made Personal</title>
<meta name="description" content="Personalised gifts, corporate awards, LED acrylic moments and engraved live-plant plaques. Customise, preview live, and gift something unforgettable.">

<link rel="preconnect" href="https://fonts.gstat<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTOSCAN · Production Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFAF6; --cream:#F5EFE4; --beige:#ECE3D2; --sand:#E2D5BF;
  --ink:#2A2624; --ink-2:#6B6157; --ink-3:#A79C8E;
  --line:rgba(42,38,36,.10); --line-2:rgba(42,38,36,.16);
  --grad:linear-gradient(118deg,#F27A2E,#EA3A4E,#E11B6B);
  --ok:#1f9d5b; --warn:#B0863F; --stop:#C4443B; --info:#3A6EA5;
  --shadow:0 1px 2px rgba(42,38,36,.06),0 8px 30px rgba(42,38,36,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
.mono{font-family:"Space Mono",ui-monospace,monospace}
a{color:inherit}

/* ---------- logo ---------- */
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;flex:none}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font-family:"Hanken Grotesk";font-weight:700;letter-spacing:.12em;font-size:14px}
.logo .wm span{font-family:"Space Mono";font-size:8.5px;letter-spacing:.22em;color:var(--ink-3);margin-top:3px}

/* ---------- login ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% -10%,var(--paper),var(--cream))}
.auth-card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);
  border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.auth-card .logo{justify-content:center;margin-bottom:22px}
.auth-card h1{font-size:23px;text-align:center;margin-bottom:4px}
.auth-card .sub{text-align:center;color:var(--ink-2);font-size:13.5px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--paper);color:var(--ink)}
.field input:focus{outline:none;border-color:#E1607A;box-shadow:0 0 0 3px rgba(234,58,78,.12)}
.btn{border:none;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14px}
.btn-primary{background:var(--grad);color:#fff;width:100%}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink)}
.err{background:rgba(196,68,59,.08);border:1px solid rgba(196,68,59,.25);color:#8f2f28;
  padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.err.show{display:block}

/* ---------- app shell ---------- */
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(252,250,246,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px}
.topbar .who{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-2)}
.topbar .who .em{font-family:"Space Mono";font-size:12px}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--cream);
  position:sticky;top:55px;z-index:19;overflow-x:auto}
.tab{border:none;background:transparent;padding:13px 14px;font-weight:600;font-size:13.5px;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:#E1607A}
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 80px}
.eyebrow{font-family:"Space Mono";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px 16px}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:600}
.stat .v{font-family:"Fraunces";font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.stat .v small{font-size:14px;color:var(--ink-3);font-family:"Space Mono"}

/* ---------- panels & tables ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.panel h2{font-size:16px;padding:15px 18px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-family:"Space Mono";font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;background:var(--cream)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.rowlink{cursor:pointer}
.rowlink:hover{background:var(--cream)}
.ref{font-family:"Space Mono";font-weight:700;font-size:13px}
.muted{color:var(--ink-2)}
.right{text-align:right}
.amt{font-family:"Space Mono";font-weight:700}

/* status pill + select */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sel{border:1px solid var(--line-2);border-radius:9px;padding:6px 8px;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:600}
.sel:focus{outline:none;border-color:#E1607A}

/* expand / production cards */
.detail{background:var(--cream)}
.detail-inner{padding:6px 16px 18px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:8px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:12px}
.pcard .ph{width:64px;height:64px;border-radius:9px;flex:none;overflow:hidden;background:var(--beige);
  display:grid;place-items:center;border:1px solid var(--line)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph.empty{font-size:10px;color:var(--ink-3);text-align:center;font-family:"Space Mono"}
.pcard .pn{font-weight:600;font-size:13.5px;line-height:1.25}
.pcard .pm{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-family:"Space Mono"}
.pcard .eng{margin-top:7px;font-size:13px;padding:5px 8px;border-radius:8px;background:var(--cream);border:1px dashed var(--line-2)}
.pcard .eng.serif{font-family:"Fraunces";font-size:15px}
.pcard .eng.mono{font-family:"Space Mono"}
.pcard a.dl{font-size:11px;font-family:"Space Mono";color:var(--info);display:inline-block;margin-top:6px}

/* catalog */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pitem{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.pitem .nm{font-weight:600;font-size:14px}
.pitem .sku{font-family:"Space Mono";font-size:11px;color:var(--ink-3);margin-top:2px}
.pitem .ctl{display:flex;align-items:center;gap:8px;margin-top:11px}
.pitem .ctl label{font-size:11px;color:var(--ink-2);font-weight:600}
.pitem .ctl input[type=number]{width:92px;padding:7px 9px;border:1px solid var(--line-2);border-radius:9px;font-family:"Space Mono"}
.pitem .save{margin-top:10px;font-size:12px;padding:7px 12px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2)}

.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.loading{padding:40px;text-align:center;color:var(--ink-3);font-family:"Space Mono";font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  transition:.3s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- toolbar / add button ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.btn-add{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:10px 15px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn-mini{background:transparent;border:1px solid var(--line-2);border-radius:9px;padding:7px 11px;font-weight:600;font-size:12.5px;color:var(--ink)}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.ic--{width:15px;height:15px;flex:none}

/* ---------- product table extras ---------- */
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--beige);border:1px solid var(--line);display:block}
.thumb.ph{display:grid;place-items:center;font-size:9px;color:var(--ink-3);font-family:"Space Mono";text-align:center}
.stockpill{font-family:"Space Mono";font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper)}
.stockpill.low{color:#8f2f28;border-color:rgba(196,68,59,.35);background:rgba(196,68,59,.06)}
.stockpill.out{color:#fff;background:var(--stop);border-color:var(--stop)}
.tag{display:inline-block;font-size:10.5px;font-family:"Space Mono";letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--beige);color:var(--ink-2);margin-left:6px}
.pactive{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ok)}
.pactive.off{background:var(--ink-3)}

/* ---------- banners ---------- */
.bcard{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
.bcard .bimg{aspect-ratio:16/6;background:var(--beige) center/cover no-repeat;display:grid;place-items:center;color:var(--ink-3);font-family:"Space Mono";font-size:11px}
.bcard .bbody{padding:13px 15px}
.bcard .bt{font-family:"Fraunces";font-size:17px;font-weight:600}
.bcard .bs{color:var(--ink-2);font-size:13px;margin-top:2px}
.bcard .bmeta{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:6px}

/* ---------- modal / forms ---------- */
.ov{position:fixed;inset:0;background:rgba(42,38,36,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.ov.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(42,38,36,.28);overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:18px}
.sheet .x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}
.sheet .body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--cream)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);color:var(--ink);font-size:13.5px}
.fld textarea{min-height:64px;resize:vertical;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:#E1607A;box-shadow:0 0 0 3px rgba(234,58,78,.10)}
.chks{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink-2);font-weight:600;padding-top:4px}
.chks label{display:inline-flex;gap:6px;align-items:center}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px;cursor:pointer;position:relative}
.drop.has{border-style:solid;padding:0;overflow:hidden}
.drop img{width:100%;max-height:150px;object-fit:cover;display:block}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .rm{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;z-index:2}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}

@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:18px 14px 70px}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="logo">
      <svg class="mark" viewBox="0 0 40 40" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#F27A2E"/><stop offset=".5" stop-color="#EA3A4E"/><stop offset="1" stop-color="#E11B6B"/></linearGradient></defs><rect x="1.5" y="1.5" width="37" height="37" rx="11" fill="url(#lg)"/><path d="M20 30.5c-6.4-4.1-9.8-7.6-9.8-11.6a5.3 5.3 0 0 1 9.8-2.8 5.3 5.3 0 0 1 9.8 2.8c0 4-3.4 7.5-9.8 11.6Z" fill="#fff"/></svg>
      <span class="wm"><b>PHOTOSCAN</b><span>PRODUCTION&nbsp;STUDIO</span></span>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Staff access to orders &amp; enquiries</p>
    <div id="authErr" class="err"></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@yourbusiness.com"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginBtn" class="btn btn-primary">Sign in</button>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">
      <svg class="mark" viewBox="0 0 40 40" fill="none"><rect x="1.5" y="1.5" width="37" height="37" rx="11" fill="url(#lg)"/><path d="M20 30.5c-6.4-4.1-9.8-7.6-9.8-11.6a5.3 5.3 0 0 1 9.8-2.8 5.3 5.3 0 0 1 9.8 2.8c0 4-3.4 7.5-9.8 11.6Z" fill="#fff"/></svg>
      <span class="wm"><b>PHOTOSCAN</b><span>PRODUCTION&nbsp;STUDIO</span></span>
    </div>
    <div class="who"><span class="em" id="whoEm"></span><button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" id="logoutBtn">Sign out</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="orders">Orders</button>
    <button class="tab" data-tab="products">Products</button>
    <button class="tab" data-tab="banners">Banners</button>
    <button class="tab" data-tab="coupons">Coupons</button>
    <button class="tab" data-tab="leads">Bulk enquiries</button>
  </div>
  <div class="wrap" id="view"></div>
</div>

<!-- modal host -->
<div id="ov" class="ov"><div class="sheet" id="sheet"></div></div>

<div id="toast" class="toast"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- setup ---------- */
var CFG = window.PHOTOSCAN_CONFIG || {};
var sb = supabase.createClient(CFG.SUPABASE_URL, CFG.ANON_KEY);
var DATA = { orders:[], leads:[], products:[], categories:[], banners:[], coupons:[] };
var expanded = {};
var MATERIALS = ['acrylic','wood','metal','led','ceramic','leather','plant'];
var modalImg = null; // holds the uploaded image URL while a modal is open

var ORDER_STATUSES = ['placed','in_production','proof_shared','shipped','delivered','cancelled'];
var LEAD_STATUSES  = ['new','contacted','quoted','won','lost'];
var STATUS_COLOR = { placed:'var(--info)', in_production:'var(--warn)', proof_shared:'#7A57B0',
  shipped:'#2E8B8B', delivered:'var(--ok)', cancelled:'var(--stop)',
  new:'var(--info)', contacted:'var(--warn)', quoted:'#7A57B0', won:'var(--ok)', lost:'var(--stop)' };

function inr(n){ return '₹' + (n==null?0:n).toLocaleString('en-IN'); }
function esc(s){ return (s==null?'':(''+s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function label(s){ return (s||'').replace(/_/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();}); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }

/* ---------- auth ---------- */
document.getElementById('loginBtn').onclick = login;
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
document.getElementById('logoutBtn').onclick = async function(){ await sb.auth.signOut(); location.reload(); };

async function login(){
  var err=document.getElementById('authErr'); err.classList.remove('show');
  var btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='Signing in…';
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('pw').value;
  var res=await sb.auth.signInWithPassword({email:email,password:pw});
  if(res.error){ showErr(err,res.error.message); btn.disabled=false; btn.textContent='Sign in'; return; }
  var ok=await verifyAdmin();
  if(!ok){ await sb.auth.signOut(); showErr(err,'This account is not an admin. Ask an owner to add you.'); btn.disabled=false; btn.textContent='Sign in'; return; }
  enterApp(res.data.user);
}
function showErr(el,msg){ el.textContent=msg; el.classList.add('show'); }

async function verifyAdmin(){
  var r=await sb.from('admins').select('id').limit(1);
  return !r.error && r.data && r.data.length>0;
}

async function boot(){
  var s=await sb.auth.getSession();
  if(s.data.session){ if(await verifyAdmin()){ enterApp(s.data.session.user); return; } await sb.auth.signOut(); }
  document.getElementById('auth').classList.remove('hidden');
}
function enterApp(user){
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoEm').textContent = user.email || 'admin';
  loadAll();
}

/* ---------- tabs ---------- */
var currentTab='overview';
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active'); currentTab=t.dataset.tab; renderView();
  };
});

/* ---------- data ---------- */
async function loadAll(){
  document.getElementById('view').innerHTML='<div class="loading">Loading your store…</div>';
  var o=await sb.from('orders').select(
    'id,human_ref,status,total_inr,subtotal_inr,delivery_inr,savings_inr,contact_email,created_at,'+
    'order_items(id,name,sku,material,qty,unit_price_inr,line_total_inr,personalizations(custom_text,font_style,image_path))'
  ).order('created_at',{ascending:false});
  var l=await sb.from('b2b_leads').select('*').order('created_at',{ascending:false});
  var p=await sb.from('products').select('*').order('sort').order('category_id');
  var c=await sb.from('categories').select('*').order('sort');
  var b=await sb.from('banners').select('*').order('sort');
  var cp=await sb.from('coupons').select('*').order('created_at',{ascending:false});
  DATA.orders=o.data||[]; DATA.leads=l.data||[]; DATA.products=p.data||[];
  DATA.categories=c.data||[]; DATA.banners=b.data||[]; DATA.coupons=cp.data||[];
  [o,l,p,c,b,cp].forEach(function(r){ if(r.error) console.error(r.error); });
  renderView();
}

/* ---------- render ---------- */
function renderView(){
  var v=document.getElementById('view');
  if(currentTab==='overview') v.innerHTML=overviewHTML();
  else if(currentTab==='orders') v.innerHTML=ordersHTML();
  else if(currentTab==='leads') v.innerHTML=leadsHTML();
  else if(currentTab==='banners') v.innerHTML=bannersHTML();
  else if(currentTab==='coupons') v.innerHTML=couponsHTML();
  else v.innerHTML=productsHTML();
}
function catName(id){ var c=DATA.categories.find(function(x){return x.id===id;}); return c?c.title:(id||'—'); }
function slugify(s){ return (''+(s||'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40); }
function uniqueId(base){ var id=base||('p-'+Date.now()); var n=1,tryId=id; while(DATA.products.some(function(p){return p.id===tryId;})){ tryId=id+'-'+(++n); } return tryId; }

function statusSelect(kind,id,current){
  var opts=(kind==='order'?ORDER_STATUSES:LEAD_STATUSES).map(function(s){
    return '<option value="'+s+'"'+(s===current?' selected':'')+'>'+label(s)+'</option>';
  }).join('');
  return '<select class="sel" onclick="event.stopPropagation()" onchange="'+(kind==='order'?'setOrderStatus':'setLeadStatus')+'(\''+id+'\',this.value)">'+opts+'</select>';
}
function pill(s){ return '<span class="pill"><span class="dot" style="background:'+(STATUS_COLOR[s]||'var(--ink-3)')+'"></span>'+label(s)+'</span>'; }

function prodCards(items){
  if(!items.length) return '<p class="muted">No line items.</p>';
  return '<div class="pcards">'+items.map(function(it){
    var per=(it.personalizations&&it.personalizations[0])||{};
    var fontCls = per.font_style==='serif'?'serif':(per.font_style==='mono'?'mono':'');
    var eng = per.custom_text ? '<div class="eng '+fontCls+'">“'+esc(per.custom_text)+'”</div>' : '';
    var phId = 'ph-'+Math.random().toString(36).slice(2);
    var ph = per.image_path
      ? '<div class="ph" id="'+phId+'"><span style="font-size:10px;color:var(--ink-3)">…</span></div>'
      : '<div class="ph empty">No photo</div>';
    if(per.image_path) signPhoto(per.image_path, phId);
    return '<div class="pcard">'+ph+'<div><div class="pn">'+esc(it.name)+'</div>'+
      '<div class="pm">'+esc(it.sku)+' · '+esc(it.material)+' · ×'+it.qty+'</div>'+eng+'</div></div>';
  }).join('')+'</div>';
}
async function signPhoto(path, elId){
  try{
    var r=await sb.storage.from('personalization').createSignedUrl(path, 3600);
    var el=document.getElementById(elId); if(!el) return;
    if(r.data&&r.data.signedUrl){
      el.innerHTML='<a href="'+r.data.signedUrl+'" target="_blank" rel="noopener" title="Open full size"><img src="'+r.data.signedUrl+'" alt="customer photo"></a>';
    } else {
      el.className='ph empty'; el.textContent='no access';
    }
  }catch(e){ var el2=document.getElementById(elId); if(el2){el2.className='ph empty';el2.textContent='error';} }
}

async function saveProductForm(existingId){
  var name=val('f_name'), sku=val('f_sku');
  if(!name||!sku){ toast('Name and SKU are required'); throw new Error('validation'); }
  var fields=[]; if(document.getElementById('f_fphoto').checked)fields.push('photo'); if(document.getElementById('f_ftext').checked)fields.push('text');
  var payload={ name:name, sku:sku, category_id:document.getElementById('f_cat').value||null,
    price_inr:parseInt(document.getElementById('f_price').value,10)||0,
    mrp_inr:parseInt(document.getElementById('f_mrp').value,10)||0,
    material:document.getElementById('f_mat').value,
    badge:val('f_badge'), blurb:val('f_blurb'),
    stock:parseInt(document.getElementById('f_stock').value,10)||0,
    low_stock_threshold:parseInt(document.getElementById('f_low').value,10)||0,
    track_inventory:document.getElementById('f_track').checked,
    active:document.getElementById('f_active').checked,
    fields:fields, image_url:modalImg||null };
  var r;
  if(existingId){ r=await sb.from('products').update(payload).eq('id',existingId); }
  else { payload.id=uniqueId(slugify(sku)||slugify(name)); r=await sb.from('products').insert(payload); }
  if(r.error){ toast(r.error.message||'Could not save'); throw r.error; }
  closeModal(); toast(existingId?'Product updated':'Product created'); await loadAll();
}

    var r=await sb.from('products').delete().eq('id',id);

};

function openModal(title,bodyHtml,saveLabel,onSave){

  var b=document.getElementById('modalSave'); if(b) b.style.background='var(--stop)';
}
window.closeModal=function(){ document.getElementById('ov').classList.remove('open'); modalImg=null; };
document.getElementById('ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeModal(); });

function dropzoneHTML(bucket){
  if(modalImg) return '<div class="drop has" id="dz"><img src="'+esc(modalImg)+'"><button type="button" class="rm" onclick="clearModalImg('+jsq(bucket)+')">Remove</button></div>';
  return '<div class="drop" id="dz">Click to upload an image<input type="file" accept="image/*" onchange="pickModalImg(this,'+jsq(bucket)+')"></div>';
}
window.pickModalImg=async function(input,bucket){
  var f=input.files&&input.files[0]; if(!f) return;
  var dz=document.getElementById('dz'); dz.innerHTML='Uploading…';
  try{
    modalImg=await uploadImage(bucket,f);
    dz.classList.add('has');
    dz.innerHTML='<img src="'+esc(modalImg)+'"><button type="button" class="rm" onclick="clearModalImg('+jsq(bucket)+')">Remove</button>';
  }catch(e){ console.error(e); toast('Image upload failed'); dz.classList.remove('has'); dz.innerHTML='Click to upload an image<input type="file" accept="image/*" onchange="pickModalImg(this,'+jsq(bucket)+')">'; }
};
window.clearModalImg=function(bucket){
  modalImg=null; var dz=document.getElementById('dz'); dz.classList.remove('has');
  dz.innerHTML='Click to upload an image<input type="file" accept="image/*" onchange="pickModalImg(this,'+jsq(bucket)+')">';
};
async function uploadImage(bucket,file){
  var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  var path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  var up=await sb.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:false});
  if(up.error) throw up.error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

/* ---------- status mutations ---------- */
window.setOrderStatus=async function(id,valv){
  var r=await sb.from('orders').update({status:valv}).eq('id',id);
  if(r.error){ toast('Could not update'); console.error(r.error); return; }
  var o=DATA.orders.find(function(x){return x.id===id;}); if(o)o.status=valv;
  toast('Order updated to “'+label(valv)+'”');
};
window.setLeadStatus=async function(id,valv){
  var r=await sb.from('b2b_leads').update({status:valv}).eq('id',id);
  if(r.error){ toast('Could not update'); console.error(r.error); return; }
  var l=DATA.leads.find(function(x){return x.id===id;}); if(l)l.status=valv;
  toast('Enquiry marked “'+label(valv)+'”');
};

/* ---------- go ---------- */
if(!CFG.SUPABASE_URL || !CFG.ANON_KEY || CFG.ANON_KEY.indexOf('PASTE_')===0){
  document.getElementById('auth').classList.remove('hidden');
  var e=document.getElementById('authErr'); e.textContent='Add your Supabase URL and anon key to config.js first.'; e.classList.add('show');
} else {
  boot();
}
</script>

.qty span{width:34px;text-align:center;font-weight:600}
.pd-feats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pd-feat{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.pd-feat svg{width:19px;height:19px;color:var(--brand-2);flex-shrink:0;margin-top:1px}

/* related */
.related{border-top:1px solid var(--line-soft);padding-top:50px;margin-top:20px}

/* ---------- studio showcase (signature) ---------- */
.showcase{background:linear-gradient(180deg,var(--cream),var(--beige));position:relative;overflow:hidden}
.showcase .wrap{display:grid;grid-template-columns:.92fr 1.08fr;gap:44px;align-items:center}
.showcase .demo{position:relative}
.demo-frame{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-l);overflow:hidden;border:1px solid rgba(255,255,255,.6)}
.demo-frame .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.demo-frame .bar i{width:10px;height:10px;border-radius:50%;background:var(--sand);display:block}
.demo-frame .bar .t{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.demo-body{display:grid;grid-template-columns:1fr 1fr}
.demo-body .live{background:var(--cream);padding:22px;display:grid;place-items:center;border-right:1px solid var(--line-soft)}
.demo-body .live svg{width:100%;max-width:230px}
.demo-body .ctrls{padding:20px}
.demo-body .ctrls .f{margin-bottom:14px}
.demo-body .ctrls label{font-size:11px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.demo-body .ctrls input{width:100%;padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px}
.demo-body .ctrls input:focus{outline:none;border-color:var(--brand-2)}
.demo-swatches{display:flex;gap:7px}
.demo-swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;transition:.2s}
.demo-swatches button.on{border-color:var(--ink)}
.showcase h2{font-size:clamp(30px,4vw,46px)}
.showcase .steps{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(42,38,36,.1)}
.step .k{font-family:var(--mono);font-size:13px;color:var(--brand-2);font-weight:700;flex-shrink:0;padding-top:2px}
.step b{font-family:var(--disp);font-size:18px;font-weight:600;display:block;margin-bottom:3px}
.step p{font-size:13.5px;color:var(--ink-2)}

/* ---------- material story ---------- */
.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mcard{border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:4/5;border:1px solid var(--line);
  display:flex;align-items:flex-end;padding:22px;color:#fff}
.mcard .bg{position:absolute;inset:0;z-index:0}
.mcard .bg svg{width:100%;height:100%}
.mcard .mv{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(24,20,18,.78))}
.mcard .txt{position:relative;z-index:2}
.mcard .txt .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;opacity:.85}
.mcard .txt h3{font-size:24px;color:#fff;margin:7px 0 5px}
.mcard .txt p{font-size:13px;opacity:.86}

/* ---------- stats ---------- */
.stats{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:48px 30px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center;position:relative;overflow:hidden}
.stats::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 100% 0,rgba(225,27,107,.28),transparent 55%)}
.stat{position:relative}
.stat b{font-family:var(--disp);font-size:clamp(30px,4vw,46px);font-weight:600;display:block}
.stat span{font-size:13px;color:#C9BEB0;letter-spacing:.02em}

/* ---------- testimonials ---------- */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tcard{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:13px}
.tcard .stars{font-size:14px}
.tcard p{font-size:14.5px;line-height:1.6;color:var(--ink)}
.tcard .who{display:flex;align-items:center;gap:11px;margin-top:auto}
.tcard .av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;
  font-weight:700;font-family:var(--disp)}
.tcard .who b{font-size:13.5px;display:block}
.tcard .who span{font-size:11.5px;color:var(--ink-3)}

/* ---------- B2B ---------- */
.b2b{background:linear-gradient(125deg,var(--ink),#3a3330);color:var(--paper);border-radius:var(--r-lg);
  overflow:hidden;position:relative}
.b2b::after{content:"";position:absolute;right:-8%;top:-30%;width:46%;height:160%;background:var(--grad);
  filter:blur(70px);opacity:.35}
.b2b .wrap-in{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:48px;position:relative;z-index:2;align-items:center}
.b2b .eyebrow{color:#E9C7A9}
.b2b h2{font-size:clamp(28px,3.6vw,40px);color:#fff;margin:12px 0 14px}
.b2b p{color:#D6CBBD;max-width:44ch}
.b2b ul{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:11px}
.b2b li{display:flex;gap:11px;align-items:center;font-size:14px;color:#EDE3D3}
.b2b li svg{width:19px;color:#7be0a3;flex-shrink:0}
.b2b-form{background:rgba(252,250,246,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-lg);
  padding:26px;backdrop-filter:blur(6px)}
.b2b-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b2b-form .f{margin-bottom:13px}
.b2b-form label{font-size:11.5px;font-weight:600;color:#D6CBBD;display:block;margin-bottom:6px}
.b2b-form input,.b2b-form select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:rgba(252,250,246,.08);color:#fff;font-family:inherit;font-size:14px}
.b2b-form input::placeholder{color:#A79C8E}
.b2b-form input:focus,.b2b-form select:focus{outline:none;border-color:var(--brand-2);background:rgba(252,250,246,.12)}
.b2b-form select option{color:#000}
.b2b-ok{text-align:center;padding:30px 10px}
.b2b-ok .ic{width:56px;height:56px;border-radius:50%;background:#1f9d5b;display:grid;place-items:center;margin:0 auto 14px}
.b2b-ok .ic svg{width:28px;color:#fff}
.b2b-ok h3{color:#fff;font-size:22px;margin-bottom:8px}
.b2b-ok p{color:#D6CBBD;margin:0 auto}

/* ---------- footer ---------- */
footer{background:var(--cream);border-top:1px solid var(--line);padding:56px 0 26px;margin-top:20px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px}
.fcol h4{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.04em;margin-bottom:14px}
.fcol a{display:block;color:var(--ink-2);font-size:13.5px;padding:5px 0;transition:.2s}
.fcol a:hover{color:var(--brand-2)}
.fabout p{font-size:13.5px;color:var(--ink-2);margin:14px 0 16px;max-width:34ch}
.fsoc{display:flex;gap:10px}
.fsoc a{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.fsoc a:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.fsoc svg{width:17px}
.fbot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);flex-wrap:wrap;gap:12px}
.pay{display:flex;gap:7px;align-items:center}
.pay span{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:3px 7px;color:var(--ink-2)}

/* ---------- cart drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,24,20,.44);backdrop-filter:blur(2px);opacity:0;visibility:hidden;
  transition:.3s;z-index:80}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--paper);z-index:90;
  transform:translateX(100%);transition:transform .42s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow-l)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line-soft)}
.drawer-head h3{font-size:20px;display:flex;align-items:center;gap:9px}
.drawer-head .x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.drawer-head .x:hover{background:var(--cream)}
.drawer-body{flex:1;overflow-y:auto;padding:8px 22px}
.citem{display:flex;gap:13px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.citem .th{width:74px;height:74px;border-radius:12px;overflow:hidden;background:var(--cream);flex-shrink:0;border:1px solid var(--line-soft)}
.citem .th svg{width:100%;height:100%}
.citem .cd{flex:1;min-width:0}
.citem .cd b{font-family:var(--disp);font-size:15.5px;font-weight:600;display:block}
.citem .cd .meta{font-size:11.5px;color:var(--ink-3);margin:3px 0 8px;font-family:var(--mono)}
.citem .cd .cf{display:flex;align-items:center;gap:12px}
.citem .cq{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:100px;padding:3px 4px}
.citem .cq button{width:24px;height:24px;border-radius:50%;font-size:15px;color:var(--ink-2)}
.citem .cq button:hover{background:var(--cream)}
.citem .price{margin-left:auto;font-family:var(--disp);font-weight:600}
.citem .rm{font-size:11.5px;color:var(--ink-3);cursor:pointer}
.citem .rm:hover{color:var(--brand-2)}
.cart-empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.cart-empty svg{width:54px;margin:0 auto 16px;color:var(--sand)}
.upsell{margin:16px 0;border:1.4px dashed var(--brand-2);border-radius:14px;padding:15px;background:var(--grad-soft)}
.upsell .u-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--brand-2);font-weight:700;margin-bottom:10px}
.upsell .u-row{display:flex;align-items:center;gap:12px}
.upsell .u-th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line-soft);flex-shrink:0}
.upsell .u-row b{font-size:14px;font-family:var(--disp);font-weight:600;display:block}
.upsell .u-row .up{font-size:12px;color:var(--ink-2)}
.upsell .u-add{margin-left:auto;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:100px;transition:.2s}
.upsell .u-add:hover{background:var(--brand-2)}
.drawer-foot{border-top:1px solid var(--line);padding:20px 22px;background:var(--cream)}
.drawer-foot .line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.drawer-foot .total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px}
.drawer-foot .total b{font-family:var(--disp);font-size:25px;font-weight:600}
.drawer-foot .save{font-size:12px;color:#1f9d5b;font-weight:600;margin-bottom:14px}
.ship-bar{background:#fff;border-radius:100px;height:8px;overflow:hidden;margin:6px 0 6px;border:1px solid var(--line-soft)}
.ship-bar i{display:block;height:100%;background:var(--grad);border-radius:100px;transition:width .5s}
.ship-note{font-size:11.5px;color:var(--ink-3);margin-bottom:14px}

/* ---------- checkout / confirm modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(30,24,20,.5);backdrop-filter:blur(3px);z-index:100;
  display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.3s}
.modal-scrim.open{opacity:1;visibility:visible}
.modal{background:var(--paper);border-radius:var(--r-lg);max-width:440px;width:100%;padding:34px;text-align:center;
  transform:scale(.94);transition:.3s;box-shadow:var(--shadow-l)}
.modal-scrim.open .modal{transform:none}
.modal .ic{width:66px;height:66px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto 18px;
  animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.modal .ic svg{width:34px;color:#fff}
.modal h3{font-size:25px;margin-bottom:10px}
.modal p{color:var(--ink-2);font-size:14.5px;margin-bottom:8px}
.modal .oid{font-family:var(--mono);font-size:13px;background:var(--cream);border:1px solid var(--line);border-radius:9px;
  padding:10px;margin:16px 0;color:var(--ink)}
.modal .flow{text-align:left;background:var(--cream);border-radius:12px;padding:15px;margin:16px 0;font-size:12.5px}
.modal .flow div{display:flex;gap:9px;align-items:center;padding:4px 0;color:var(--ink-2)}
.modal .flow svg{width:15px;color:#1f9d5b;flex-shrink:0}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:22px;left:22px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:13px 17px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-l);font-size:13.5px;max-width:340px;transform:translateX(-120%);opacity:0;transition:.4s cubic-bezier(.2,.7,.3,1)}
.toast.show{transform:none;opacity:1}
.toast .ti{width:30px;height:30px;border-radius:8px;background:var(--grad);display:grid;place-items:center;flex-shrink:0}
.toast .ti svg{width:16px;color:#fff}
.toast b{font-weight:600}
.toast .td{font-size:11.5px;color:#C9BEB0}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .hero .wrap{grid-template-columns:1fr;gap:30px;padding-top:40px}
  .hero-stage{height:380px;max-width:460px;margin:0 auto}
  .showcase .wrap,.b2b .wrap-in,.pd{grid-template-columns:1fr}
  .cats,.materials,.tgrid{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:repeat(3,1fr)}
  .studio-wrap{position:static}
  .b2b .wrap-in{padding:34px}
}
@media(max-width:720px){
  .mainnav{display:none}
  .burger{display:grid}
  .pgrid,.cats,.stats,.tgrid,.materials{grid-template-columns:repeat(2,1fr)}
  .stats{padding:34px 18px;gap:26px 16px}
  .b2b-form .row,.pd-feats{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .demo-body{grid-template-columns:1fr}
  .demo-body .live{border-right:none;border-bottom:1px solid var(--line-soft)}
  section.block{padding:54px 0}
  .sec-head{flex-direction:column;align-items:flex-start}
  .fbot{flex-direction:column;text-align:center}
}
@media(max-width:460px){
  .pgrid,.cats,.tgrid,.materials{grid-template-columns:1fr}
  .hero-trust{gap:18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   PHOTOSCAN storefront — data + logic
   Backend hooks (Supabase / Make.com / CRM) are marked //HOOK
   ============================================================ */

/* ===== BACKEND CONNECTION =======================================
   Your project URL is already filled in.
   Paste your anon / publishable key between the quotes below.
   (Supabase dashboard → Project Settings → API Keys → "anon public".)
   ================================================================ */
const PHOTOSCAN_SUPABASE_URL = (window.PHOTOSCAN_CONFIG && window.PHOTOSCAN_CONFIG.SUPABASE_URL) || "https://lxkhltmnxhwdrndmkxnq.supabase.co";
const PHOTOSCAN_ANON_KEY     = (window.PHOTOSCAN_CONFIG && window.PHOTOSCAN_CONFIG.ANON_KEY) || "PASTE_YOUR_ANON_KEY_HERE";

const sb = supabase.createClient(PHOTOSCAN_SUPABASE_URL, PHOTOSCAN_ANON_KEY);
const FN_BASE = PHOTOSCAN_SUPABASE_URL + "/functions/v1";
function keyMissing(){ return PHOTOSCAN_ANON_KEY.indexOf("PASTE_") === 0; }

// Give every visitor a lightweight (anonymous) identity so they can
// upload photos and place orders without creating an account.
let AUTH_READY = (async () => {
  try {
    if (keyMissing()) { console.warn("PHOTOSCAN: anon key not set yet."); return; }
    const { data } = await sb.auth.getSession();
    if (!data.session) await sb.auth.signInAnonymously();
  } catch (e) { console.error("PHOTOSCAN auth error:", e); }
})();
async function currentUid(){
  await AUTH_READY;
  const { data } = await sb.auth.getUser();
  return data && data.user ? data.user.id : null;
}

/* ---- material SVG renderers (self-contained product art) ---- */
function matArt(mat,opts){
  opts=opts||{};
  var photo=opts.photo, text=opts.text||'', font=opts.font||'disp', id='c'+Math.random().toString(36).slice(2,7);

function onUpload(input){
  var f=input.files&&input.files[0];if(!f)return;
  if(f.size>15*1024*1024){toast('Too large','Please pick an image under 15 MB.');return;}
  var rd=new FileReader();
  rd.onload=function(e){
    studio.photo=e.target.result;studio.file=f.name;renderStage();
    var drop=document.getElementById('drop');if(drop)drop.classList.add('has');
    document.getElementById('upInfo').innerHTML='<div class="upfile"><svg width="16" viewBox="0 0 24 24" fill="none" stroke="#1f9d5b" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> '+esc(f.name)+'<span class="rm" onclick="clearPhoto()">Remove</span></div>';
    uploadPhoto(f); // send original to private storage in the background
  };
  rd.readAsDataURL(f);
}
// Uploads the file to the private 'personalization' bucket and stores the
// resulting path on studio.image_path (that path — not the image — goes with the order).
async function uploadPhoto(f){
  try{
    if(keyMissing()) return;
    var uid = await currentUid(); if(!uid) return;
    var ext = (f.name.split('.').pop()||'jpg').toLowerCase();
    var path = uid + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.' + ext;
    var up = await sb.storage.from('personalization').upload(path, f, {contentType:f.type, upsert:false});
    if(up.error){ console.error('upload', up.error); return; }
    studio.image_path = path;
  }catch(e){ console.error('uploadPhoto', e); }
}
function clearPhoto(){studio.photo=null;studio.file=null;studio.image_path=null;renderStage();var d=document.getElementById('drop');if(d)d.classList.remove('has');document.getElementById('upInfo').innerHTML='';}
function qtyChg(d){studio.qty=Math.max(1,studio.qty+d);document.getElementById('qtyVal').textContent=studio.qty;}

    text:studio.text,photo:studio.photo,image_path:studio.image_path||null,font:studio.font,qty:studio.qty,sku:p.sku});

        coupon: coupon.code||null,
        contact:{ email:null, phone:null }   // (optional) collect these on a checkout form later
      })
    });
    var out=await res.json();
    if(!out || !out.ok){ toast('Checkout failed', (out&&out.error)||'Please try again'); if(btn){btn.disabled=false;btn.textContent='Secure checkout';} return; }

    // clear any saved cart so no abandoned-cart email fires
    try{ var uid=await currentUid(); if(uid){ await sb.from('abandoned_carts').update({recovered:true}).eq('customer_id',uid); } }catch(_){}

    closeCart();
    showOrderModal(out.order_ref, out.total_inr);
  }catch(err){
    console.error('checkout', err);
    toast('Checkout failed','Network error — please try again');
    if(btn){ btn.disabled=false; btn.textContent='Secure checkout'; }
  }
}

function finishOrder(){cart=[];coupon={code:null,info:null};syncCart();document.getElementById('modal').classList.remove('open');go('home');toast('Thank you','We’ll email your design proof shortly.',true);}

function render(html){document.getElementById('app').innerHTML=html;initReveal();window.scrollTo({top:0,behavior:'instant'in document.documentElement.style?'instant':'auto'});}
function go(v){currentView=v;if(v==='home'){render(homeHTML());initHomeExtras();renderBanners();}}
function shopCat(cat){currentView='shop';render(shopHTML(cat));window.scrollTo(0,0);}
function openProduct(id){var p=byId(id);currentView='product';render(productHTML(p));}
function scrollToId(id){var el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth'});}else{go('home');setTimeout(function(){var e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'});},120);}}

/* ============ toasts ============ */
function toast(title,desc,good){
  var t=document.createElement('div');t.className='toast';
  t.innerHTML='<div class="ti">'+(good?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>')+'</div><div><b>'+title+'</b><div class="td">'+desc+'</div></div>';
  document.getElementById('toasts').appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},450);},3400);
}

/* ============ reveal + counters + extras ============ */
var io;
function initReveal(){
  if(io)io.disconnect();
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver'in window)){els.forEach(function(e){e.classList.add('in');});return;}
  io=new IntersectionObserver(function(ent){ent.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);if(en.target.querySelector('[data-count]'))runCounters(en.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  els.forEach(function(e){io.observe(e);});
}
function runCounters(scope){
  scope.querySelectorAll('[data-count]').forEach(function(el){
    var target=+el.getAttribute('data-count'),disp=el.getAttribute('data-disp'),start=0,t0=null,dur=1400;
    function step(ts){if(!t0)t0=ts;var pr=Math.min((ts-t0)/dur,1);var e=1-Math.pow(1-pr,3);
      el.textContent=pr<1?fmt(Math.floor(e*target)):disp;if(pr<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}
function fmt(n){if(n>=10000000)return (n/10000000).toFixed(1)+' Cr';if(n>=100000)return (n/100000).toFixed(0)+' L';if(n>=1000)return (n/1000).toFixed(0)+' K';return n;}

/* ================= DB-DRIVEN CATALOG · BANNERS · COUPONS ================= */
var DBBANNERS=[];
var coupon={code:null,info:null};
function jsq2(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function mapDbProduct(p){
  return {id:p.id,cat:p.category_id,name:p.name,sku:p.sku,price:p.price_inr,mrp:p.mrp_inr,
    mat:p.material,fields:p.fields||[],rating:p.rating||5,rev:p.reviews||0,
    badge:p.badge||undefined,blurb:p.blurb||'',image_url:p.image_url||null,
    stock:(p.stock==null?null:p.stock),track:!!p.track_inventory};
}
async function loadCatalogFromDB(){
  if(keyMissing()) return;
  try{
    var pr=await sb.from('products').select('*').eq('active',true).order('sort');
    var cr=await sb.from('categories').select('*').order('sort');
    var br=await sb.from('banners').select('*').eq('active',true).order('sort');
    if(br.data) DBBANNERS=br.data;
    if(cr.data&&cr.data.length){
      var C={}; cr.data.forEach(function(c){
        C[c.id]={label:c.title,k:(CATS[c.id]&&CATS[c.id].k)||'',art:(CATS[c.id]&&CATS[c.id].art)||'wood'};
      });
      CATS=C;
    }
    if(pr.data&&pr.data.length){
      PRODUCTS=pr.data.map(mapDbProduct);
      UPSELL=PRODUCTS.find(function(p){return p.id==='pen-igi';})||PRODUCTS[0];
    }
    if(currentView==='home'){ render(homeHTML()); initHomeExtras(); renderBanners(); }
  }catch(e){ console.error('catalog load',e); }
}
function renderBanners(){
  if(currentView!=='home' || !DBBANNERS.length) return;
  var b=DBBANNERS[0], app=document.getElementById('app');
  var host=document.getElementById('promoStrip');
  if(!host){ host=document.createElement('div'); host.id='promoStrip'; app.insertBefore(host, app.firstChild); }
  var bg=b.image_url?('background-image:linear-gradient(90deg,rgba(42,38,36,.55),rgba(42,38,36,.15)),url(\''+esc(b.image_url)+'\');'):'background:var(--grad);';
  host.innerHTML='<div style="'+bg+'background-size:cover;background-position:center;color:#fff;border-radius:16px;margin:14px auto 0;max-width:1180px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">'+
    '<div><div style="font-family:Fraunces,serif;font-size:22px;font-weight:600">'+esc(b.title||'')+'</div>'+
    (b.subtitle?'<div style="opacity:.92;font-size:14px;margin-top:3px">'+esc(b.subtitle)+'</div>':'')+'</div>'+
    (b.cta_label?'<button style="background:#fff;color:var(--ink);font-weight:700;border:none;border-radius:10px;padding:10px 16px;cursor:pointer" onclick="bannerCta('+jsq2(b.link_url||'')+')">'+esc(b.cta_label)+'</button>':'')+
    '</div>';
}
function bannerCta(link){
  if(!link||link==='#shop'){ shopCat('all'); return; }
  if(link.charAt(0)==='#'){ scrollToId(link.slice(1)); }
  else if(CATS[link]){ shopCat(link); } else { shopCat('all'); }
}
function couponDiscount(st){
  if(!coupon.info) return 0;
  var c=coupon.info; if(st < (c.min_order_inr||0)) return 0;
  return c.kind==='percent' ? Math.round(st*Math.min(100,c.value)/100) : Math.min(st,c.value);
}
async function applyCoupon(){
  var inp=document.getElementById('couponInp'); if(!inp) return;
  var code=(inp.value||'').trim().toUpperCase(); if(!code) return;
  if(keyMissing()){ toast('Backend needed','Add your anon key to use coupons'); return; }
  var r=await sb.from('coupons').select('*').eq('code',code).maybeSingle();
  var c=r.data, ok=c && c.active && (!c.expires_at || new Date(c.expires_at)>new Date());
  if(!ok){ coupon={code:null,info:null}; toast('Invalid code','That coupon isn’t available'); renderCart(); return; }
  coupon={code:code,info:c};
  if(subtotal() < (c.min_order_inr||0)) toast('Almost there','Spend '+inr(c.min_order_inr)+' to use '+code);
  else toast('Coupon applied','“'+code+'” is on your order',true);
  renderCart();
}

document.getElementById('roller').innerHTML=anns[0];ai=1;
go('home');
loadCatalogFromDB();
